---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Update flake
'on':
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0' # every sunday on 5am

concurrency:
  group: ${{ forgejo.ref }}-${{ forgejo.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  main:
    runs-on: nix
    environment: production
    steps:
      - name: Checkout
        run: |
          git clone "http://x-access-token:${FORGEJO_TOKEN}@${FORGEJO_SERVER_URL#http*://}/${FORGEJO_REPOSITORY}.git" .

          printf 'secretspec:\n  enable: false\n' > devenv.local.yaml

      - name: Update, build and push to cache
        run: |-
          mkdir -p ~/.config/nix
          echo 'experimental-features = nix-command flakes' > ~/.config/nix/nix.conf
          nix eval --raw --file lib/nix-conf.nix >> ~/.config/nix/nix.conf

          nix run .#cache -- --ci --update-flake
        env:
          CI: "true"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Push back to repo
        run: |
          git config user.name "robodexo2000[bot]"
          git config user.email "robodexo2000@ajgon.casa"
          git config core.hooksPath /dev/null
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git commit -m 'chore(deps): lock file maintenance'
          git push origin master
